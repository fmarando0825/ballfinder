<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1a12">
<title>Ball Finder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0e1a12; color: #eef2ee;
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden; user-select: none;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* the camera picture, with the box drawn on top */
  /* aspect-ratio is replaced at run time with the camera's real shape */
  #stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 52vh;
           background: #000; flex: none; }
  #video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  #video { object-fit: contain; }
  #overlay { pointer-events: none; }

  /* the big readout underneath: words, meter, close-up */
  #readout { flex: 1; min-height: 0; display: flex; flex-direction: column;
             align-items: center; justify-content: center; gap: 10px; padding: 10px 14px; }
  #verdict {
    font-size: 8.5vw; font-weight: 800; letter-spacing: .01em; text-align: center;
    color: #4e6a58; transition: color .1s;
  }
  #verdict.on { color: #ff2fff; }
  #meterwrap { width: 100%; max-width: 460px; }
  #meter { position: relative; height: 22px; background: #1b2a20;
           border: 1px solid #2f4a38; border-radius: 11px; overflow: hidden; }
  #meter > i { display: block; height: 100%; width: 0; background: #6f8a78; transition: width .1s; }
  #meter > i.on { background: linear-gradient(90deg, #ff2fff, #ff9cff); }
  #meter > span {                     /* the 40% beep bar */
    position: absolute; top: -3px; bottom: -3px; left: 40%;
    width: 2px; background: #eef2ee; opacity: .75;
  }
  #meterlabels { display: flex; justify-content: space-between;
                 font-size: 11px; color: #7d9686; margin-top: 3px; }
  #zoom { width: 132px; height: 132px; border-radius: 14px; background: #000;
          border: 2px solid #2f4a38; opacity: .25; transition: opacity .15s; }
  #zoom.on { opacity: 1; border-color: #ff2fff; }

  #status { padding: 4px 14px 8px; text-align: center; font-size: 15px;
            color: #a9c2b0; min-height: 40px; }
  #status b { color: #eef2ee; }
  #bar { height: 4px; background: #24382a; flex: none; }
  #bar > i { display: block; height: 100%; width: 0; background: #47d18a; transition: width .2s; }

  /* the one big button */
  #go {
    margin: 0 14px 6px; padding: 22px; border: none; border-radius: 18px;
    font-size: 26px; font-weight: 800; letter-spacing: .04em; flex: none;
    background: #2bbd6e; color: #04180c; box-shadow: 0 6px 0 #1d8b50;
  }
  #go:active { transform: translateY(3px); box-shadow: 0 3px 0 #1d8b50; }
  #go.stop { background: #e0483f; color: #fff; box-shadow: 0 6px 0 #a32f28; }
  #go:disabled { background: #35493c; color: #8ba393; box-shadow: 0 6px 0 #24382a; }

  #settings {
    display: flex; gap: 10px; justify-content: center; align-items: center;
    padding: 0 14px 10px; font-size: 14px; color: #a9c2b0; flex-wrap: wrap; flex: none;
  }
  #settings label { display: flex; align-items: center; gap: 6px; }
  select { background: #1b2a20; color: #eef2ee; border: 1px solid #2f4a38;
           border-radius: 8px; padding: 6px 8px; font-size: 14px; }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: #2bbd6e; }
  #tally { font-variant-numeric: tabular-nums; width: 100%; text-align: center;
           font-size: 12px; color: #7d9686; }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<div id="readout">
  <div id="verdict">READY</div>
  <div id="meterwrap">
    <div id="meter"><i id="meterfill"></i><span></span></div>
    <div id="meterlabels"><span>0%</span><span>beep bar 40%</span><span>100%</span></div>
  </div>
  <canvas id="zoom" width="264" height="264"></canvas>
</div>

<div id="bar"><i id="barfill"></i></div>
<div id="status">Waking up the brain&hellip;</div>

<button id="go" disabled>START</button>

<div id="settings">
  <label>Head start
    <select id="headstart">
      <option value="0">none</option>
      <option value="10" selected>10 s</option>
      <option value="20">20 s</option>
      <option value="30">30 s</option>
    </select>
  </label>
  <label><input type="checkbox" id="sound" checked> Clicks</label>
  <label><input type="checkbox" id="buzz" checked> Buzz</label>
  <div id="tally"></div>
</div>

<script src="ort/ort.webgpu.min.js"></script>
<script src="ball_detect.js"></script>
<script src="app.js"></script>
</body>
</html>
